<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="avatar-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <clipPath id="circle-clip">
      <circle cx="100" cy="100" r="90" />
    </clipPath>
  </defs>
  <!-- Background -->
  <circle cx="100" cy="100" r="95" fill="url(#bg-grad)" stroke="#4f46e5" stroke-width="3" />
  
  <g clip-path="url(#circle-clip)">
    <!-- Shadow/Glow -->
    <circle cx="100" cy="100" r="80" fill="none" stroke="#06b6d4" stroke-width="1" opacity="0.3" />
    
    <!-- Body/Shoulders -->
    <path d="M 40 180 C 40 140, 70 120, 100 120 C 130 120, 160 140, 160 180" fill="url(#avatar-grad)" />
    
    <!-- Head -->
    <circle cx="100" cy="80" r="32" fill="#e2e8f0" />
    
    <!-- Developer details: glasses and hair stylized -->
    <!-- Hair -->
    <path d="M 68 80 C 65 60, 75 45, 100 45 C 125 45, 135 60, 132 80 C 124 75, 115 72, 100 72 C 85 72, 76 75, 68 80 Z" fill="#1e293b" />
    
    <!-- Glasses -->
    <rect x="78" y="74" width="18" height="12" rx="3" fill="none" stroke="#0f172a" stroke-width="3" />
    <rect x="104" y="74" width="18" height="12" rx="3" fill="none" stroke="#0f172a" stroke-width="3" />
    <line x1="96" y1="80" x2="104" y2="80" stroke="#0f172a" stroke-width="3" />
    
    <!-- Laptop screen reflection overlay -->
    <path d="M 60 160 L 140 160 L 125 195 L 75 195 Z" fill="#06b6d4" opacity="0.2" />
    <path d="M 50 185 L 150 185" stroke="#06b6d4" stroke-width="2" opacity="0.5" />
  </g>
</svg>
